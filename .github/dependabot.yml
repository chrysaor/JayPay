version: 2

updates:
  - package-ecosystem: gradle
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
      gradle-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /backend/services/*
      - /frontend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /infra/docker
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
