name: Release

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    uses: ./.github/workflows/smoke.yml

  release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the image tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          if [ "$REF_TYPE" = tag ]; then
            version=${REF_NAME#v}
            image_tag=$REF_NAME
            if ! git branch --remotes --contains HEAD | grep -Eq '^\s*origin/master$'; then
              echo "::error::$REF_NAME must point at a commit on master"
              exit 1
            fi
          else
            version=${REF_NAME#release/}
            image_tag="$version-rc.$short_sha"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$REF_NAME is neither vX.Y.Z nor release/X.Y.Z"
            exit 1
          fi
          echo "image-tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/changelog.py notes CHANGELOG.md "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: make dependencies
      - run: make verify
      - run: make images
      - run: make scan-images

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - run: make push TAG="$IMAGE_TAG"
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image-tag }}

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for delay in 0 15 30 60 120; do
            sleep "$delay"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG already has a GitHub Release"
              exit 0
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" && exit 0
          done
          exit 1
