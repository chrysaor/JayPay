name: Smoke

on:
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: make dependencies
      - run: make images
      - run: make infra/docker/.env
      - name: Mask the values of infra/docker/.env
        run: sed -n 's/^[A-Z_]*=//p' infra/docker/.env | while read -r value; do echo "::add-mask::$value"; done

      - name: Memory before the stack
        run: |
          {
            echo '```'
            free -m
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: make up
      - name: Memory with the stack up
        run: |
          {
            echo '```'
            free -m
            docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: make smoke
      - name: Memory after the smoke
        if: always()
        run: |
          {
            echo '```'
            free -m
            docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect the service logs
        if: failure()
        run: python3 scripts/stack-logs.py "$RUNNER_TEMP/stack-logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: stack-logs
          path: ${{ runner.temp }}/stack-logs
          retention-days: 14
      - if: always()
        run: make down
