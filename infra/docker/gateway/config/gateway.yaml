---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: admin-operator
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: jaypay
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-operator-membership
  jwt:
    providers:
      - name: staff
        issuer: http://localhost:8091/realms/staff
        audiences:
          - jaypay-admin-console
        remoteJWKS:
          uri: http://keycloak:8080/realms/staff/protocol/openid-connect/certs
  authorization:
    defaultAction: Deny
    rules:
      - name: operator-or-above
        action: Allow
        principal:
          jwt:
            provider: staff
            claims:
              - name: realm_access.roles
                valueType: StringArray
                values:
                  - operator
                  - admin

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: admin-viewer
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: jaypay
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-viewer-event-flow
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-viewer-membership
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-viewer-money-aggregation
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-viewer-money-query
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-viewer-payment
  jwt:
    providers:
      - name: staff
        issuer: http://localhost:8091/realms/staff
        audiences:
          - jaypay-admin-console
        remoteJWKS:
          uri: http://keycloak:8080/realms/staff/protocol/openid-connect/certs
  authorization:
    defaultAction: Deny
    rules:
      - name: viewer-or-above
        action: Allow
        principal:
          jwt:
            provider: staff
            claims:
              - name: realm_access.roles
                valueType: StringArray
                values:
                  - viewer
                  - operator
                  - admin
