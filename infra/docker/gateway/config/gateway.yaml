---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: admin-api
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: jaypay
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-operator-membership
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-viewer-event-flow
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-viewer-membership
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-viewer-money-aggregation
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-viewer-money-query
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-viewer-payment
  timeout:
    tcp:
      connectTimeout: 5s
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 401
      response:
        contentType: application/json
        body:
          type: Inline
          inline: '{"error":"UNAUTHENTICATED","message":"Sign in again."}'
    - match:
        statusCodes:
          - type: Value
            value: 403
      response:
        contentType: application/json
        body:
          type: Inline
          inline: '{"error":"FORBIDDEN","message":"Your role does not allow this."}'

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: jaypay
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: admin
      protocol: HTTP
      port: 8091
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-operator-membership
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: jaypay
spec:
  parentRefs:
    -
      name: gateway
      sectionName: admin
  rules:
    - matches:
        - method: PUT
          path:
            type: RegularExpression
            value: /api/membership/memberships/[^/]+
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: admin-api-membership
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: membership-service

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-viewer-event-flow
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: jaypay
spec:
  parentRefs:
    -
      name: gateway
      sectionName: admin
  rules:
    - matches:
        - method: GET
          path:
            type: RegularExpression
            value: /api/event-flow/flows
        - method: GET
          path:
            type: RegularExpression
            value: /api/event-flow/flows/[^/]+/[^/]+
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: admin-api-event-flow
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: event-flow-service

