global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: jaypay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - membership-service:8080
          - banking-service:8080
          - money-service:8080
          - remittance-service:8080
          - payment-service:8080
          - money-aggregation-service:8080
          - money-query-service:8080
          - settlement-service:8080
          - logging-consumer:8080
          - task-consumer:8080
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
