<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 400" width="1084" height="400" role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title id="title">JayPay request path</title>
<desc id="desc">The customer site forwards /api/&lt;service&gt;/ to banking-service, membership-service, money-service, payment-service, remittance-service. The admin console asks auth-service before every call and then forwards to membership-service, money-aggregation-service, money-query-service, payment-service. settlement-service runs a batch against banking-service and payment-service.</desc>
<style>
.bg{fill:#ffffff}
.box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2}
.t{fill:#1f2328;font-size:12.5px;font-weight:600;text-anchor:middle}
.s{fill:#59636e;font-size:11px;text-anchor:middle}
.l{font-size:11px}
.grid{stroke:#d1d9e0;stroke-width:1}
.cell{fill:#ddf4ff}
.blue{stroke:#0969da;fill:none;stroke-width:1.6}.bluef{fill:#0969da}.bluebox{fill:#ddf4ff;stroke:#0969da;stroke-width:1.4}
.orange{stroke:#bc4c00;fill:none;stroke-width:1.6}.orangef{fill:#bc4c00}.orangebox{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.4}
.purple{stroke:#8250df;fill:none;stroke-width:1.6}.purplef{fill:#8250df}.purplebox{fill:#fbefff;stroke:#8250df;stroke-width:1.4}
.green{stroke:#1a7f37;fill:none;stroke-width:1.6}.greenf{fill:#1a7f37}.greenbox{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.4}
.gray{stroke:#6e7781;fill:none;stroke-width:1.4}.grayf{fill:#59636e}
.dashed{stroke-dasharray:5 4}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.box{fill:#161b22;stroke:#6e7681}.t{fill:#e6edf3}.s{fill:#9198a1}
.grid{stroke:#3d444d}.cell{fill:#0c2d6b}
.blue{stroke:#58a6ff}.bluef{fill:#58a6ff}.bluebox{fill:#0c2d6b;stroke:#58a6ff}
.orange{stroke:#f0883e}.orangef{fill:#f0883e}.orangebox{fill:#5a1e02;stroke:#f0883e}
.purple{stroke:#bc8cff}.purplef{fill:#bc8cff}.purplebox{fill:#2e1461;stroke:#bc8cff}
.green{stroke:#3fb950}.greenf{fill:#3fb950}.greenbox{fill:#04260f;stroke:#3fb950}
.gray{stroke:#8b949e}.grayf{fill:#9198a1}}
</style>
<rect class="bg" x="0" y="0" width="1084" height="400" rx="12"/>
<rect class="bluebox" x="290" y="24" width="200" height="52" rx="8"/>
<text class="t" x="390" y="47">frontend-web</text>
<text class="s" x="390" y="63">customer site, port 8090</text>
<rect class="orangebox" x="594" y="24" width="200" height="52" rx="8"/>
<text class="t" x="694" y="47">frontend-admin</text>
<text class="s" x="694" y="63">admin console, port 8091</text>
<rect class="box" x="918" y="24" width="150" height="52" rx="8"/>
<text class="t" x="993" y="47">auth-service</text>
<text class="s" x="993" y="63">staff, port 8089</text>
