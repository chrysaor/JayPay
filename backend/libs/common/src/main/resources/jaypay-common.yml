spring:
  jackson:
    use-jackson2-defaults: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      properties:
        "[max.block.ms]": 2000
axon:
  axonserver:
    servers: ${AXON_AXONSERVER_SERVERS:localhost:8124}
  serializer:
    general: xstream
    events: jackson
    messages: jackson
jaypay:
  http:
    connect-timeout: 2s
    request-timeout: 10s
flow:
  topic: jaypay.flow.events
logging:
  topic: jaypay.logging.out.stdout
  structured:
    format:
      console: ${LOG_FORMAT:}
management:
  server:
    port: 9080
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: local
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
