spring:
  jackson:
    use-jackson2-defaults: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
axon:
  axonserver:
    servers: ${AXON_AXONSERVER_SERVERS:localhost:8124}
  serializer:
    general: xstream
    events: jackson
    messages: jackson
jaypay:
  http:
    connect-timeout: 2s
    request-timeout: 10s
logging:
  topic: jaypay.logging.out.stdout
  structured:
    format:
      console: ${LOG_FORMAT:}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
