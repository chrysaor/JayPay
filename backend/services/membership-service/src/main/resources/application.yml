spring:
  application:
    name: membership-service
  config:
    import: classpath:jaypay-common.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jaypay}
    username: ${SPRING_DATASOURCE_USERNAME:jaypay}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  cloud:
    vault:
      token: ${SPRING_CLOUD_VAULT_TOKEN}
      scheme: ${SPRING_CLOUD_VAULT_SCHEME:http}
      host: ${SPRING_CLOUD_VAULT_HOST:localhost}
      port: ${SPRING_CLOUD_VAULT_PORT:8200}
jwt:
  secret: ${JWT_SECRET}
