spring:
  application:
    name: payment-service
  config:
    import: classpath:jaypay-common.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jaypay}
    username: ${SPRING_DATASOURCE_USERNAME:jaypay}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
payment:
  amount:
    max: 10000000
  fee-rate-basis-points: 300
  sweep:
    every: 30s
    retry-after: 60s
    attempts: 5
service:
  membership:
    url: ${SERVICE_MEMBERSHIP_URL:http://localhost:8081}
  money:
    url: ${SERVICE_MONEY_URL:http://localhost:8083}
