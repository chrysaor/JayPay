spring:
  application:
    name: money-service
  config:
    import: classpath:jaypay-common.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jaypay}
    username: ${SPRING_DATASOURCE_USERNAME:jaypay}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
money:
  amount:
    max: 10000000
  recharge:
    deadline: 60s
    rollback:
      retry-after: 30s
      attempts: 5
service:
  banking:
    url: ${SERVICE_BANKING_URL:http://localhost:8082}
  membership:
    url: ${SERVICE_MEMBERSHIP_URL:http://localhost:8081}
