gatewayClassName: ""
standalone: false
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 128Mi
listeners:
  web: 8090
  admin: 8091
backendPort: 8080
connectTimeout: 5s
staff:
  issuer: ""
  jwksUri: ""
  audience: jaypay-admin-console
  roles:
    viewer: [viewer, operator, admin]
    operator: [operator, admin]
adminConsole:
  site: frontend-admin
  identity:
    backend: keycloak
    paths: [/realms/staff/, /resources/]
  services:
    membership: membership-service
    payment: payment-service
    money-aggregation: money-aggregation-service
    money-query: money-query-service
    event-flow: event-flow-service
  routes:
    - { role: viewer, service: membership, method: GET, path: "/memberships/[^/]+" }
    - { role: viewer, service: membership, method: GET, path: "/memberships/address/[^/]+" }
    - { role: operator, service: membership, method: PUT, path: "/memberships/[^/]+" }
    - { role: viewer, service: money-aggregation, method: POST, path: /money/aggregation/get-money-sum-by-address }
    - { role: viewer, service: money-query, method: GET, path: "/money/query/get-money-sum-by-address/[^/]+" }
    - { role: viewer, service: payment, method: GET, path: /payment/normal-status }
    - { role: viewer, service: event-flow, method: GET, path: /flows }
    - { role: viewer, service: event-flow, method: GET, path: "/flows/[^/]+/[^/]+" }
customerSite:
  site: frontend-web
  services:
    membership: membership-service
    banking: banking-service
    money: money-service
    remittance: remittance-service
    payment: payment-service
  routes:
    - { service: membership, method: POST, path: /memberships, limit: signIn }
    - { service: membership, method: POST, path: /memberships/login, limit: signIn }
    - { service: membership, method: POST, path: /memberships/refresh-token, limit: signIn }
    - { service: membership, method: POST, path: /memberships/token-validate }
    - { service: membership, method: GET, path: "/memberships/[0-9]+" }
    - { service: banking, method: GET, path: "/banking/account/[0-9]+" }
    - { service: banking, method: POST, path: /banking/account/register }
    - { service: money, method: POST, path: /money/member-money }
    - { service: money, method: POST, path: /money/increase }
    - { service: remittance, method: POST, path: /remittance/request }
    - { service: payment, method: POST, path: /payment/request }
  limits:
    all: { requests: 300, unit: Minute }
    signIn: { requests: 30, unit: Minute }
