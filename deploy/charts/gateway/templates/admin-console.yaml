{{- $console := .Values.adminConsole }}
{{- $parent := dict "name" .Release.Name "sectionName" "admin" }}
{{- $staffRoutes := include "gateway.staffRoutes" . | fromJson }}
{{- range $prefix, $backend := $console.services }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: admin-api-{{ $prefix }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
spec:
  urlRewrite:
    path:
      type: ReplaceRegexMatch
      replaceRegexMatch:
        pattern: ^/api/{{ $prefix }}/
        substitution: /
---
{{- end }}
{{- range $name, $group := $staffRoutes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - {{- toYaml $parent | nindent 6 }}
  rules:
    - matches:
        {{- range $console.routes }}
        {{- if and (eq .role $group.role) (eq .service $group.service) }}
        - method: {{ .method }}
          path:
            type: RegularExpression
            value: /api/{{ .service }}{{ .path }}
        {{- end }}
        {{- end }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: admin-api-{{ $group.service }}
      backendRefs:
        {{- include "gateway.backendRef" (get $console.services $group.service) | nindent 8 }}
---
{{- end }}
{{- range $role, $allowed := .Values.staff.roles }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: admin-{{ $role }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
spec:
  targetRefs:
    {{- range $name, $group := $staffRoutes }}
    {{- if eq $group.role $role }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}
    {{- end }}
    {{- end }}
  jwt:
    providers:
      - name: staff
        issuer: {{ $.Values.staff.issuer }}
        audiences:
          - {{ $.Values.staff.audience }}
        remoteJWKS:
          uri: {{ $.Values.staff.jwksUri }}
  authorization:
    defaultAction: Deny
    rules:
      - name: {{ $role }}-or-above
        action: Allow
        principal:
          jwt:
            provider: staff
            claims:
              - name: realm_access.roles
                valueType: StringArray
                values:
                  {{- toYaml $allowed | nindent 18 }}
---
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: admin-api
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
    {{- range $name, $group := $staffRoutes }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}
    {{- end }}
  timeout:
    tcp:
      connectTimeout: {{ .Values.connectTimeout }}
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 401
      response:
        contentType: application/json
        body:
          type: Inline
          inline: '{"error":"UNAUTHENTICATED","message":"Sign in again."}'
    - match:
        statusCodes:
          - type: Value
            value: 403
      response:
        contentType: application/json
        body:
          type: Inline
          inline: '{"error":"FORBIDDEN","message":"Your role does not allow this."}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-identity
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - {{- toYaml $parent | nindent 6 }}
  rules:
    - matches:
        {{- range $console.identity.paths }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      backendRefs:
        {{- include "gateway.backendRef" $console.identity.backend | nindent 8 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-site
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - {{- toYaml $parent | nindent 6 }}
  rules:
    - backendRefs:
        {{- include "gateway.backendRef" $console.site | nindent 8 }}
