ingress:
  frontend-admin: [http]
  frontend-web: [http]
calls:
  auth-service:
    http: [frontend-admin]
    management: [prometheus]
  axon-server:
    grpc: [auth-service, axon-server, banking-service, event-flow-service, logging-consumer, membership-service, money-aggregation-service, money-query-service, money-service, payment-service, remittance-service, settlement-service]
    http: [axon-server]
  banking-service:
    http: [frontend-web, money-service, remittance-service, settlement-service]
    management: [prometheus]
  clickhouse:
    native: [grafana, otel-collector]
  dynamodb:
    http: [money-query-service]
  event-flow-service:
    http: [frontend-admin]
    management: [prometheus]
  kafka:
    kafka: [auth-service, banking-service, event-flow-service, kafka, logging-consumer, membership-service, money-aggregation-service, money-query-service, money-service, payment-service, remittance-service, settlement-service]
  keycloak:
    http: [auth-service, frontend-admin]
  logging-consumer:
    management: [prometheus]
  membership-service:
    http: [banking-service, frontend-admin, frontend-web, money-aggregation-service, money-query-service, money-service, payment-service, remittance-service]
    management: [prometheus]
  money-aggregation-service:
    http: [frontend-admin]
    management: [prometheus]
  money-query-service:
    http: [frontend-admin]
    management: [prometheus]
  money-service:
    http: [frontend-web, money-aggregation-service, payment-service, remittance-service]
    management: [prometheus]
  otel-collector:
    otlp-http: [auth-service, banking-service, event-flow-service, logging-consumer, membership-service, money-aggregation-service, money-query-service, money-service, payment-service, remittance-service, settlement-service]
  payment-service:
    http: [frontend-admin, frontend-web, settlement-service]
    management: [prometheus]
  postgres:
    postgres: [banking-service, event-flow-service, keycloak, membership-service, money-aggregation-service, money-query-service, money-service, payment-service, remittance-service, settlement-service]
  prometheus:
    http: [grafana]
  remittance-service:
    http: [frontend-web]
    management: [prometheus]
  settlement-service:
    management: [prometheus]
  vault:
    http: [membership-service]
