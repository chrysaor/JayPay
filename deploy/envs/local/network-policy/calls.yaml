gateway:
  banking-service: [http]
  event-flow-service: [http]
  frontend-admin: [http]
  frontend-web: [http]
  keycloak: [http]
  membership-service: [http]
  money-aggregation-service: [http]
  money-query-service: [http]
  money-service: [http]
  payment-service: [http]
  remittance-service: [http]
calls:
  axon-server:
    grpc: [axon-server, banking-service, event-flow-service, logging-consumer, membership-service, money-aggregation-service, money-query-service, money-service, payment-service, remittance-service, settlement-service]
    http: [axon-server]
  banking-service:
    http: [money-service, remittance-service, settlement-service]
    management: [prometheus]
  clickhouse:
    native: [grafana, otel-collector]
  dynamodb:
    http: [money-query-service]
  event-flow-service:
    management: [prometheus]
  kafka:
    kafka: [banking-service, event-flow-service, kafka, logging-consumer, membership-service, money-aggregation-service, money-query-service, money-service, payment-service, remittance-service, settlement-service]
  logging-consumer:
    management: [prometheus]
  membership-service:
    http: [banking-service, money-aggregation-service, money-query-service, money-service, payment-service, remittance-service]
    management: [prometheus]
  money-aggregation-service:
    management: [prometheus]
  money-query-service:
    management: [prometheus]
  money-service:
    http: [money-aggregation-service, payment-service, remittance-service]
    management: [prometheus]
  otel-collector:
    otlp-http: [banking-service, event-flow-service, logging-consumer, membership-service, money-aggregation-service, money-query-service, money-service, payment-service, remittance-service, settlement-service]
  payment-service:
    http: [settlement-service]
    management: [prometheus]
  postgres:
    postgres: [banking-service, event-flow-service, keycloak, membership-service, money-aggregation-service, money-query-service, money-service, payment-service, remittance-service, settlement-service]
  prometheus:
    http: [grafana]
  remittance-service:
    management: [prometheus]
  settlement-service:
    management: [prometheus]
  vault:
    http: [membership-service]
