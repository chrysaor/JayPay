image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
env:
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
  KC_DB_USERNAME: jaypay
  KC_DB_POOL_MAX_SIZE: "10"
  JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25
  KC_HOSTNAME: http://admin.jaypay.localhost:8480
  KC_HOSTNAME_ADMIN: http://localhost:8092
  KC_HTTP_ENABLED: "true"
  KC_HEALTH_ENABLED: "true"
  KC_CACHE: local
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
secretEnv:
  KC_DB_PASSWORD: POSTGRES_PASSWORD
  KC_BOOTSTRAP_ADMIN_PASSWORD: KEYCLOAK_ADMIN_PASSWORD
  STAFF_ADMIN_USERNAME: STAFF_ADMIN_USERNAME
  STAFF_ADMIN_PASSWORD: STAFF_ADMIN_PASSWORD
  STAFF_OPERATOR_USERNAME: STAFF_OPERATOR_USERNAME
  STAFF_OPERATOR_PASSWORD: STAFF_OPERATOR_PASSWORD
  STAFF_VIEWER_USERNAME: STAFF_VIEWER_USERNAME
  STAFF_VIEWER_PASSWORD: STAFF_VIEWER_PASSWORD
resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    memory: 768Mi
