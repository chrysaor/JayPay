apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-config
  namespace: envoy-gateway-system
data:
  envoy-gateway.yaml: |
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: EnvoyGateway
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    logging:
      level:
        default: info
    provider:
      type: Kubernetes
      kubernetes:
        rateLimitDeployment:
          container:
            image: docker.io/envoyproxy/ratelimit:5ae0682e
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 64Mi
        shutdownManager:
          image: envoyproxy/gateway:v1.10.0
    rateLimit:
      backend:
        type: Redis
        redis:
          url: valkey.envoy-gateway-system.svc.cluster.local:6379
      failClosed: false
