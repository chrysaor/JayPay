apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          volumeMounts:
            - name: jaypay-git
              mountPath: /jaypay/git
              readOnly: true
      volumes:
        - name: jaypay-git
          hostPath:
            path: /jaypay/git
            type: Directory
